# Settings for the pre-PR review flow (https://github.com/Bugzbaggy/sql-ready).
# .githooks/pr-ready-stamp.sh reads them (run `bash .githooks/pr-ready-stamp.sh config` to see the
# values in effect), and so do /pr-ready, /review-before-commit and the CI review, which reads this
# file from the PR's base branch, so a PR can't change its own review rules.
# One "key = value" per line. Values aren't quoted; an empty value means "none".

# The branch PRs go into.
base_branch = main

# Paths that never need review, space-separated: a folder ends with /, anything else is one file.
# Migration/ is written by generate-migration-scripts.yml; deploy/ belongs to the pipeline owners,
# and Archive/ holds rollback scripts. Docs never need review and needn't be listed.
skip_paths = Migration/ Archive/ deploy/

# The part of skip_paths that CI writes. /pr-ready flags a commit there by anyone but generator_bot.
generated_paths = Migration/
generator_bot = github-actions[bot]

# The nitsql analyzer the pre-commit hook and nitsql.yml run; /pr-ready runs it on the .sql files in
# scope.
lint_command = python .githooks/analyze_sql.py --json

# The documentation gate the pre-commit hook runs, and the skill to run when it blocks.
doc_gate = bash .githooks/sql-doc-gate.sh
documenter = /schemalore

# Rules every review follows, local and CI, on one line.
review_note = Don't report what the nitsql linter (.githooks/analyze_sql.py) already flags at commit and on every PR: SELECT *, a missing SET NOCOUNT ON or SET XACT_ABORT ON, a transaction without TRY-CATCH, NOLOCK hints, cursors, non-SARGable predicates or a leading-wildcard LIKE, UPDATE or DELETE without WHERE, and INSERT without a column list.
