flyway.url=jdbc:sqlserver://listener.region1.example.com:1433;databaseName=AppDb_Analytics;encrypt=true;trustServerCertificate=true;multiSubnetFailover=true
#flyway.user=$env:STG_DB_USER
#flyway.password=$env:STG_DB_PASS
flyway.locations=filesystem:C:\Jenkins\workspace\ect_AppDb_Analytics_PRODUCTION_master\Migration
flyway.createSchemas=true
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.validateMigrationNaming=true

# Baseline configuration
flyway.baselineVersion=0.00000
flyway.baselineDescription=Initial baseline

flyway.baselineOnMigrate=true

# Allow a single migration to contain both transactional and non-transactional
# statements. Flyway's SQL Server parser classifies some CREATE OR ALTER
# PROCEDURE batches as non-transactional, which conflicts with the transactional
# GRANT / CREATE VIEW statements bundled into the same generated repeatable
# migration and aborts the deploy with "Detected both transactional and
# non-transactional statements within the same migration (even though mixed is
# false)". Transactional statements are still wrapped in a transaction; this
# only permits the mix.
flyway.mixed=true
