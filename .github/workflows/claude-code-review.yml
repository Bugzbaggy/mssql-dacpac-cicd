name: Claude Code Review

# Automated reviewer built on Claude Code's built-in /code-review skill - the same command people
# run locally as `/code-review medium <PR URL>` - run through anthropics/claude-code-action. It only
# comments: nothing here blocks a merge, changes code or connects to a database.
#
#   PR opened / marked ready for review  -> full review of the PR
#   PR comment "/code-review [effort]"    -> on-demand full re-review by a user with write access
#                                            (comment triggers run from master's copy of this file)
#   new commits pushed to an open PR      -> review of just the pushed commits
#
# The model runs read-only on every path. A separate job that runs no model posts the findings as
# inline comments on the reviewed commit, skipping lines outside the PR diff and any line this
# workflow has already commented on, so a re-review only adds what is new.
#
# Migration scripts (Migration/**) are generated by generate-migration-scripts.yml and are out of
# scope: the review is told to ignore them, and pushes that only touch them aren't reviewed.
#
# Needs an ANTHROPIC_API_KEY repository secret.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    branches: [master]
    paths-ignore:
      - 'Migration/**'
      - 'Archive/**'
      - 'deploy/**'
  issue_comment:
    types: [created]

env:
  REVIEW_MODEL: claude-opus-5-5
  # Passed on every run: when omitted, the skill reuses the value stored by an earlier run, which
  # on a persistent (self-hosted) runner carries over between jobs.
  MAX_FINDINGS: '10'
  # Hard stop for a runaway run. --max-turns does not bound the review: the skill runs as a forked
  # subagent whose turns are not counted, while --max-budget-usd counts subagent spend.
  MAX_BUDGET_USD: '10'
  # Appended to the review target: the only place the forked /code-review reads extra instructions
  # from (text added with --append-system-prompt does not reach it). It leaves the nitsql linter's
  # rules to the linter, so the same finding isn't raised twice.
  REVIEW_NOTE: >-
    - Repository note: ignore migration scripts. Files under Migration/ are generated by CI, so report
    no findings on them; read the whole diff rather than excluding paths. Don't report what the
    nitsql linter (.githooks/analyze_sql.py) already flags at commit and on every PR: SELECT *,
    a missing SET NOCOUNT ON or SET XACT_ABORT ON, a transaction without TRY-CATCH, NOLOCK hints,
    cursors, non-SARGable predicates or a leading-wildcard LIKE, UPDATE or DELETE without WHERE, and
    INSERT without a column list.
  # CI-only instructions. They steer the reviewer away from command forms the permission rules deny
  # (cd compounds, git -C, gh, echo), which otherwise cost turns or leave the diff unread, and since
  # CI has no database access, they have findings that depend on the data marked for the developer
  # to check.
  CI_REVIEW_NOTE: >-
    Run git from the current directory, which is the repository root, without cd or git -C; gh and echo
    are not available. Uncommitted changes in the working tree are CI restores of review settings, not
    part of the change under review. This review can't query a database: when a finding depends on
    production data (NULLs, duplicate keys, column types, sentinel values, the rows a data fix
    touches), start its summary with "Needs data check:" and name the query that would settle it.

jobs:
  # Decides whether a PR event or comment gets a review before anything joins the review job's
  # concurrency group, so a comment from someone without write access cannot cancel a running review.
  pr-gate:
    name: Check review request
    if: >-
      (github.event_name == 'pull_request'
        && github.event.action != 'synchronize'
        && !github.event.pull_request.draft
        && github.event.pull_request.user.type != 'Bot'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && startsWith(github.event.comment.body, '/code-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The reactions on /code-review comments let the commenter see the request was handled. Reacting
    # to a comment on a pull request needs pull-requests: write; issues: write alone gets a 403.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      effort: ${{ steps.pr.outputs.effort }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      url: ${{ steps.pr.outputs.url }}
      pr_number: ${{ steps.pr.outputs.pr_number }}

    steps:
      - name: Resolve PR and effort
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          # A comment-triggered run is attached to master's latest commit, not the PR, so a reaction
          # on the comment is the only feedback the commenter gets.
          react() {
            [ -n "${COMMENT_ID:-}" ] || return 0
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="$1" --silent || true
          }
          skip() { echo "::notice::$1"; react confused; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          effort=medium
          if [ -n "${COMMENT_BODY:-}" ]; then
            first_line=${COMMENT_BODY%%$'\n'*}
            read -r cmd arg _ <<< "${first_line//$'\r'/}" || true
            # Case-insensitive, like the startsWith() in this job's if:. Not a command: no reaction.
            if [ "${cmd,,}" != "/code-review" ]; then
              echo "::notice::Comment is not a /code-review command"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # author_association can hide org members whose membership is private, so ask the
            # collaborator API instead - the same check claude-code-action makes before it runs.
            perm=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission) ||
              skip "Could not check $COMMENTER's permission"
            case "$perm" in admin|write) ;; *) skip "$COMMENTER has $perm access; a re-review needs write" ;; esac
            effort=${arg:-medium}
            effort=${effort,,}
            # Like the CLI, fall back to medium for an unknown level (ultra, a flag, a typo).
            case "$effort" in
              low|medium|high|xhigh|max) ;;
              *) echo "::notice::Unknown effort '$effort' - using medium"; effort=medium ;;
            esac
          fi

          # One field per line, so an empty field (a deleted fork's repo) can't shift the others.
          fields=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha, (.head.repo.full_name // ""), .state, .base.ref') ||
            skip "Could not look up PR #$PR_NUMBER"
          head_sha='' head_repo='' state='' base_ref=''
          { read -r head_sha; read -r head_repo; read -r state; read -r base_ref; } <<< "$fields" || true
          [ -n "$head_sha" ] || skip "Could not look up PR #$PR_NUMBER"
          [ "$head_repo" = "$REPO" ] || skip "PR #$PR_NUMBER comes from a fork (${head_repo:-deleted repository})"
          [ "$state" = "open" ] || skip "PR #$PR_NUMBER is $state"
          react eyes
          {
            echo "skip=false"
            echo "effort=$effort"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
            echo "url=https://github.com/$REPO/pull/$PR_NUMBER"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

  pr-review:
    name: Review PR
    needs: pr-gate
    if: needs.pr-gate.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-code-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # Read-only: the model runs here. pr-review-post posts the findings.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings: ${{ steps.summary.outputs.findings }}

    steps:
      - &check-open
        name: Check the PR is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # A PR merged or closed before this job starts (say, merged right after "Ready for review")
          # isn't reviewed. A review already running when the PR closes still finishes, but the
          # posting jobs check again and post nothing on a closed PR.
          state=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .state) || {
            echo "::warning::Could not check whether PR #$PR_NUMBER is still open; reviewing anyway"
            state=open
          }
          if [ "$state" = open ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #$PR_NUMBER is $state, so it isn't reviewed"
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.open.outputs.open == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.pr-gate.outputs.head_sha }}
          fetch-depth: 0

      - name: Use the base branch's review instructions
        if: steps.open.outputs.open == 'true'
        env:
          BASE_REF: ${{ needs.pr-gate.outputs.base_ref }}
        run: &restore-instructions |
          set -euo pipefail
          # claude-code-action restores the root .claude/, CLAUDE.md and CLAUDE.local.md from the base
          # branch (keeping the PR's copies in .claude-pr/, which the deny rules block). Do the same for
          # the files it leaves at the PR head - nested CLAUDE.md, AGENTS.md anywhere, nested .claude/,
          # REVIEW.md anywhere - which Claude Code loads or a reviewer may read as a brief, so the code
          # under review cannot rewrite its own review instructions.
          base="origin/$BASE_REF"
          git diff -z --name-only --no-renames "$base" HEAD -- \
              ':(glob)*/**/CLAUDE.md' ':(glob)*/**/CLAUDE.local.md' ':(glob)**/AGENTS.md' ':(glob)*/**/.claude/**' \
              ':(glob)**/REVIEW.md' |
            while IFS= read -r -d '' p; do
              if git cat-file -e "$base:$p" 2>/dev/null; then
                # Separate commands, so a failed restore fails the job (fail closed) under set -e.
                git checkout --quiet "$base" -- "$p"
                git reset --quiet -- "$p"
                echo "Reverted $p to $base"
              else
                rm -f -- "$p"
                echo "Removed $p (not on $base)"
              fi
              # Keep the restore out of `git diff HEAD`, which the skill reads for uncommitted changes.
              if git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then
                git update-index --skip-worktree -- "$p"
              fi
            done

      - name: Run /code-review
        id: review
        if: steps.open.outputs.open == 'true'
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245 (Claude Code 2.1.293)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # The PR's full change as a range: with gh denied the reviewer can't look the PR up, and the
          # head is often the migration bot's commit. Without --comment, /code-review returns its
          # findings as JSON, and pr-review-post posts them.
          prompt: /code-review ${{ needs.pr-gate.outputs.effort }} origin/${{ needs.pr-gate.outputs.base_ref }}...${{ needs.pr-gate.outputs.head_sha }} --max-findings ${{ env.MAX_FINDINGS }} ${{ env.REVIEW_NOTE }} ${{ env.CI_REVIEW_NOTE }}
          # The deny rules block Claude Code's auto-approved read-only commands that would expose the
          # job token (git remote/config/ls-remote, echo, env, printenv, ps, pgrep) or pull in text that
          # users without write access can post (all of gh). They also block reads of .claude-pr/, the
          # action's copy of the PR's own root CLAUDE.md and .claude/, and git show <rev>:<path> and git
          # blame of CLAUDE.md, CLAUDE.local.md, .claude/, AGENTS.md and REVIEW.md at the PR head, so
          # the PR's own copies are not loaded as review instructions. They aren't airtight (a blob can
          # still be read by its id); the PR's changes to those files still reach the reviewer through
          # the diff, as code under review.
          # disableAllHooks stops the repo's hooks from running the PR branch's .githooks/ (the action
          # restores .claude/ from the base branch, not .githooks/). CLAUDE_CODE_DISABLE_BACKGROUND_TASKS
          # makes any subagent the review starts run in the foreground: as a background task the
          # session could end while it was still running, before the findings were written.
          claude_args: &review-claude-args >-
            --model ${{ env.REVIEW_MODEL }}
            --max-budget-usd ${{ env.MAX_BUDGET_USD }}
            --settings '{"disableAllHooks":true,"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"}}'
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(cd:*)"
            --disallowedTools "Read(./.git/**),Read(./.claude-pr/**),Bash(gh:*),Bash(git remote:*),Bash(git config:*),Bash(git ls-remote:*),Bash(echo:*),Bash(printenv:*),Bash(env:*),Bash(ps:*),Bash(pgrep:*),Bash(git show *:CLAUDE.md*),Bash(git show *:*/CLAUDE.md*),Bash(git show *:.claude/*),Bash(git show *:*/.claude/*),Bash(git show *:AGENTS.md*),Bash(git show *:*/AGENTS.md*),Bash(git show *:CLAUDE.local.md*),Bash(git show *:*/CLAUDE.local.md*),Bash(git show *:REVIEW.md*),Bash(git show *:*/REVIEW.md*),Bash(git blame *CLAUDE.md*),Bash(git blame *CLAUDE.local.md*),Bash(git blame *.claude/*),Bash(git blame *AGENTS.md*),Bash(git blame *REVIEW.md*)"

      - name: Summarize
        id: summary
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          TARGET: ${{ needs.pr-gate.outputs.url }}
          MODE: pr
        shell: python
        run: &summarize |
          import json, os, re, sys

          # Strip GitHub and Anthropic credentials from anything written to the summary or the PR.
          SECRET = re.compile(r"gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}"
                              r"|sk-ant-[A-Za-z0-9_-]{10,}|x-access-token:[^@\s]+@")

          def redact(s):
              return SECRET.sub("[redacted]", str(s))

          def num(v):
              try:
                  return float(v)
              except (TypeError, ValueError):
                  return 0.0

          def line_of(f):
              # A real line number, or None: a finding without one is listed here but never posted.
              try:
                  line = int(f.get("line"))
              except (TypeError, ValueError):
                  return None
              return line if line >= 1 else None

          msgs = [m for m in json.load(open(os.environ["EXECUTION_FILE"], encoding="utf-8")) if isinstance(m, dict)]
          res = next((m for m in reversed(msgs) if m.get("type") == "result"), {})
          subtype = res.get("subtype", "unknown")
          # A crashed or killed run can leave these null or missing.
          cost = f"cost ${num(res.get('total_cost_usd')):.2f}, {int(num(res.get('duration_ms'))) // 1000}s"
          denied = [str((d.get("tool_input") or {}).get("command") or d.get("tool_name"))
                    for d in res.get("permission_denials") or [] if isinstance(d, dict)]

          # Did any git diff/show call actually succeed? The skill's own messages are in the transcript.
          commands, succeeded = {}, set()
          for m in msgs:
              message = m.get("message")   # a string on some system messages, e.g. permission_denied
              content = message.get("content") if isinstance(message, dict) else None
              for c in content if isinstance(content, list) else []:
                  if not isinstance(c, dict):
                      continue
                  if c.get("type") == "tool_use" and c.get("name") == "Bash":
                      commands[c.get("id")] = str((c.get("input") or {}).get("command", ""))
                  elif c.get("type") == "tool_result" and not c.get("is_error"):
                      succeeded.add(c.get("tool_use_id"))
          read_diff = any(re.search(r"\bgit\b[^|;&]*\b(diff|show)\b|\bgit\b[^|;&]*\blog\b[^|;&]*(\s-p\b|--patch)", cmd)
                          for tid, cmd in commands.items() if tid in succeeded)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(f"## /code-review of {os.environ['TARGET']}\n\n")
              # Error results (budget cap, max turns, crash) carry no result text or local_command.
              if subtype != "success":
                  errors = "; ".join(str(e) for e in res.get("errors") or []) or "no details"
                  s.write(f"The review stopped early ({subtype}): {redact(errors)}\n\n{cost}\n")
                  print(f"::error::/code-review stopped early: {subtype}")
                  sys.exit(1)
              # An unknown /command does not fail the run - it is sent to the model as plain text -
              # so check that the skill really ran before trusting the output. The built-in
              # /code-review reports itself as result.local_command.
              if res.get("local_command") != "code_review":
                  s.write("The /code-review skill did not run; see the job log.\n")
                  print(f"::error::/code-review did not run (result.local_command is {res.get('local_command')!r})")
                  sys.exit(1)

              text = redact(res.get("result") or "")
              # With no host UI attached, the skill prints its findings as a fenced JSON array.
              block = re.search(r"```json\s*(\[.*?\])\s*```", text, re.S)
              try:
                  findings = json.loads(block.group(1)) if block else []
              except ValueError:
                  findings = []
              # The cap the review was given with --max-findings, when that is a positive integer;
              # 'all', 'default' or anything else leaves the limit to the skill.
              mf = (os.environ.get("MAX_FINDINGS") or "").strip()
              cap = int(mf) if mf.isascii() and mf.isdigit() and int(mf) > 0 else None
              findings = [f for f in findings if isinstance(f, dict)][:cap]

              if findings:
                  s.write("| Location | Finding |\n|---|---|\n")
                  for f in findings:
                      line = line_of(f)
                      loc = f"{f.get('file', '?')}:{line}" if line else str(f.get("file", "?"))
                      s.write(f"| `{loc}` | {redact(f.get('summary', '')).replace('|', '/')} |\n")
                  where = ("the reviewed PR head" if os.environ.get("MODE") == "pr" else "the pushed commit")
                  s.write(f"\nThe next job posts these as inline comments on {where}, skipping lines this "
                          "workflow has already commented on. A finding whose line is outside the PR diff, "
                          "or that has no line number, can only be listed here.\n")
              else:
                  s.write(text or "_No output._")
              if denied:
                  s.write("\n\nCommands the permission rules denied:\n")
                  s.write("".join(f"- `{redact(d)[:200]}`\n" for d in denied))
              s.write(f"\n\n{subtype}: {cost}\n")

              # A review whose diff reads were all denied reports "no findings" without having
              # looked; don't let that pass as a clean review.
              if not findings and denied and not read_diff:
                  s.write("\n**Review incomplete:** no git diff/show command succeeded, so the diff was "
                          "probably never read. Comment `/code-review` to try again.\n")
                  print("::error::/code-review never read the diff (all diff commands were denied)")
                  sys.exit(1)

          # For the posting job: the findings as compact, redacted JSON (line null if unknown).
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              keep = [{"file": str(f.get("file", "")), "line": line_of(f),
                       "summary": redact(f.get("summary", "")), "failure_scenario": redact(f.get("failure_scenario", ""))}
                      for f in findings]
              out.write(f"findings={json.dumps(keep)}\n")

  # The PR path's only job with write access. It runs no model and no repository code: it posts the
  # findings pr-review produced as inline comments on the reviewed head.
  pr-review-post:
    name: Post PR review comments
    needs: [pr-gate, pr-review]
    if: needs.pr-review.outputs.findings != '' && needs.pr-review.outputs.findings != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: read is for the compare API, which gives the reviewed commit's diff when the PR has
    # moved on. Without it the call fails on a private repo, and the duplicate check is lost.
    # pull-requests: write covers the inline comments.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Post findings as inline comments
        env:
          FINDINGS: ${{ needs.pr-review.outputs.findings }}
          LABEL: /code-review of the pull request
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.pr-gate.outputs.pr_number }}
          COMMIT_ID: ${{ needs.pr-gate.outputs.head_sha }}
          BASE_REF: ${{ needs.pr-gate.outputs.base_ref }}
        shell: python
        run: &post-findings |
          import hashlib, json, os, re, urllib.error, urllib.parse, urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          pr_url = f"{api}/repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}"
          headers = {"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          findings = json.loads(os.environ.get("FINDINGS") or "[]")
          BOT = "github-actions[bot]"
          MARK = re.compile(r"<!-- code-review fp=([0-9a-f]{16}) -->")

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                  return json.load(r), r.headers.get("Link") or ""

          def get_all(url):  # follows the Link: rel="next" pages
              items = []
              while url:
                  page, link = get(url)
                  items += page
                  nxt = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = nxt.group(1) if nxt else None
              return items

          def line_of(f):
              try:
                  return int(f.get("line"))
              except (TypeError, ValueError):
                  return None

          def where(f):
              return f"{f['file']}:{line_of(f)}" if line_of(f) else f["file"]

          def fingerprint(path, text):  # the line's own text, so a reworded finding still matches
              return hashlib.sha256(f"{path}|{' '.join(text.split())}".encode()).hexdigest()[:16]

          # The review takes minutes: don't post on a PR that was merged or closed in the meantime.
          try:
              pr = get(pr_url)[0]
              state, head = pr.get("state", "open"), (pr.get("head") or {}).get("sha")
          except Exception as e:  # can't tell, so post as usual
              print(f"::warning::Could not check whether the PR is still open ({type(e).__name__}); posting anyway")
              state, head = "open", None

          posted, skipped, failed = 0, [], []
          if state == "open":
              # The PR diff's right-hand lines and their text as of the reviewed commit: the only lines
              # GitHub takes comments on there. When the PR has moved on since the review, that's the
              # reviewed commit compared with the base branch, not the PR's current diff (the compare
              # API lists at most 300 files: beyond that, post without the checks).
              # Files GitHub returns without a patch (too large) are left to GitHub to accept or reject.
              diff_lines, no_patch = {}, set()
              try:
                  if head and head != os.environ["COMMIT_ID"]:
                      base = urllib.parse.quote(os.environ.get("BASE_REF") or "master", safe="")
                      files = get(f"{api}/repos/{os.environ['REPO']}/compare/{base}...{os.environ['COMMIT_ID']}")[0].get("files") or []
                      if len(files) >= 300:
                          raise ValueError("the compare API lists at most 300 files")
                  else:
                      files = get_all(f"{pr_url}/files?per_page=100")
                  for pf in files:
                      if not pf.get("patch"):
                          no_patch.add(pf["filename"])
                          continue
                      n = 0
                      for row in pf["patch"].split("\n"):
                          hunk = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@", row)
                          if hunk:
                              n = int(hunk.group(1))
                          elif row[:1] in ("+", " "):
                              diff_lines[(pf["filename"], n)] = row[1:]
                              n += 1
              except Exception as e:
                  print(f"::warning::Could not read the PR diff ({type(e).__name__}); posting without the duplicate check")
                  diff_lines = None
              # What this workflow already said on the PR, per file: each comment's fingerprint (None on
              # comments without one), the line it sits on now (None once GitHub marks it outdated) and
              # the line it was made on. GitHub moves a comment with its line, and marks it outdated once
              # the line itself changes.
              def load_said():
                  said = {}
                  for c in get_all(f"{pr_url}/comments?per_page=100"):
                      if (c.get("user") or {}).get("login") != BOT:
                          continue
                      m = MARK.search(c.get("body") or "")
                      said.setdefault(c.get("path"), []).append(
                          (m.group(1) if m else None, line_of({"line": c.get("line")}), line_of({"line": c.get("original_line")})))
                  return said

              said, ours = {}, []   # ours: what this run has posted so far
              try:
                  said = load_said()
              except Exception as e:
                  print(f"::warning::Could not read the PR's comments ({type(e).__name__}); duplicates are possible")

              def already_said(path, line, fp):
                  # One comment per line: the same line text (fingerprint) where a comment sits now (give or
                  # take the lines pushed since the reviewed commit), or near where an outdated one was made.
                  # The same text elsewhere in the file (END, GO) is a different line.
                  for old, now, made in said.get(path, []) + [(o, n, n) for p, o, n in ours if p == path]:
                      if old is None and now == line:
                          return "this line already has a review comment"
                      if fp and old == fp and ((now is not None and abs(now - line) <= 2)
                                               or (now is None and made is not None and abs(made - line) <= 20)):
                          return "already raised on this line"
                  return None

              for f in findings:
                  path, line = f.get("file"), line_of(f)
                  if not line:
                      failed.append((f, "no line number"))
                      continue
                  fp = ""
                  if diff_lines is not None and path not in no_patch:
                      text = diff_lines.get((path, line))
                      if text is None:
                          skipped.append((f, "outside the PR diff"))
                          continue
                      fp = fingerprint(path, text)
                  why = already_said(path, line, fp)
                  if not why:
                      # Another posting job for this PR may be running: look at the PR's comments again
                      # just before posting, rather than queueing the jobs (GitHub cancels a waiting job
                      # when a third one queues, and its findings would be lost). At most MAX_FINDINGS
                      # reads.
                      try:
                          said = load_said()
                      except Exception:
                          pass
                      why = already_said(path, line, fp)
                  if why:
                      skipped.append((f, why))
                      continue
                  # Already redacted by the Summarize step.
                  body = (f"**{f['summary']}**\n\n{f['failure_scenario']}\n\n<sub>{os.environ['LABEL']}</sub>"
                          + (f"\n\n<!-- code-review fp={fp} -->" if fp else ""))
                  payload = {"body": body, "commit_id": os.environ["COMMIT_ID"], "path": path, "line": line,
                             "side": "RIGHT"}
                  req = urllib.request.Request(f"{pr_url}/comments", data=json.dumps(payload).encode(), method="POST",
                                               headers={**headers, "Content-Type": "application/json"})
                  try:
                      urllib.request.urlopen(req, timeout=30).close()
                      posted += 1
                      ours.append((path, fp or None, line))
                  except urllib.error.HTTPError as e:
                      failed.append((f, f"HTTP {e.code}"))
                  except Exception as e:  # timeouts and dropped connections must not stop the loop
                      failed.append((f, f"{type(e).__name__}: {e}"))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              if state != "open":
                  print(f"::notice::The PR is {state}, so its {len(findings)} findings weren't posted")
                  s.write(f"## Not posted: the PR is {state}\n\n")
                  s.write("".join(f"- `{where(f)}` {f['summary'].replace('|', '/')}\n" for f in findings))
              else:
                  s.write(f"## Posted {posted} of {len(findings)} findings as inline comments\n\n")
                  for f, why in skipped:
                      s.write(f"- skipped ({why}): `{where(f)}` {f['summary'].replace('|', '/')}\n")
                  for f, error in failed:
                      print(f"::warning::Could not post the finding at {where(f)} ({error})")
                      s.write(f"- not posted ({error}): `{where(f)}` {f['summary'].replace('|', '/')}\n")
                  if failed:
                      s.write("\nA 422 means GitHub rejected the line; every finding is also listed in the "
                              "review job's summary.\n")

  commit-review:
    name: Review new commits
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'synchronize'
      && !github.event.pull_request.draft
      && github.event.sender.type != 'Bot'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-code-review-push-${{ github.event.after }}
      cancel-in-progress: false
    # Read-only: the model runs here. Posting happens in commit-review-post, this path's only job
    # with write access.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      findings: ${{ steps.summary.outputs.findings }}
      target: ${{ steps.range.outputs.target }}

    steps:
      - *check-open

      - name: Checkout
        if: steps.open.outputs.open == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        if: steps.open.outputs.open == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          base="origin/$BASE_REF"
          base_after=$(git merge-base "$base" "$AFTER")
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            if [ -z "$(git rev-list --no-merges "$BEFORE..$AFTER" --not "$base")" ]; then
              # Only merges of the base branch, which bring in other people's reviewed commits -
              # unless a merge carries a conflict resolution or other hand edits. GitHub runs no PR
              # workflows while a PR has a merge conflict, so review such a merge with the whole
              # branch, which also covers commits pushed while the conflict lasted.
              [ -n "$(git log --merges --remerge-diff --format= "$BEFORE..$AFTER" --not "$base" -- . \
                  ':(exclude)Migration/**' ':(exclude)Archive/**' ':(exclude)deploy/**' ':(exclude).vs/**')" ] ||
                skip "This push only merged $BASE_REF into the branch"
              target="$base_after...$AFTER"
            elif [ "$(git merge-base "$base" "$BEFORE")" = "$base_after" ]; then
              # Same base as before - including a pull of the migration bot's commit - so the pushed
              # range holds only the new work.
              target="$BEFORE...$AFTER"
            else
              # The push merged the base branch in as well: review the branch against the new base.
              target="$base_after...$AFTER"
            fi
          else
            # After a force-push or rebase the old head is no longer an ancestor: review the branch.
            target="$base_after...$AFTER"
          fi

          # Skip ranges that only touch paths the reviewer ignores.
          reviewable=$(git diff --name-only "$target" -- . ':(exclude)Migration/**' ':(exclude)Archive/**' ':(exclude)deploy/**' ':(exclude).vs/**' | wc -l)
          [ "$reviewable" -gt 0 ] || skip "No reviewable files in $target"

          git checkout --quiet --detach "$AFTER"
          {
            echo "skip=false"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Use the base branch's review instructions
        if: steps.range.outputs.skip == 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: *restore-instructions

      - name: Run /code-review
        id: review
        if: steps.range.outputs.skip == 'false'
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245 (Claude Code 2.1.293)
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: /code-review medium ${{ steps.range.outputs.target }} --max-findings ${{ env.MAX_FINDINGS }} ${{ env.REVIEW_NOTE }} ${{ env.CI_REVIEW_NOTE }}
          claude_args: *review-claude-args

      - name: Summarize
        id: summary
        if: always() && steps.review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          TARGET: ${{ steps.range.outputs.target }}
          MODE: push
        shell: python
        run: *summarize

  # The per-push path's only job with write access. It runs no model and no repository code: it
  # posts the findings commit-review produced as inline comments on the pushed commit.
  commit-review-post:
    name: Post review comments
    needs: commit-review
    if: needs.commit-review.outputs.findings != '' && needs.commit-review.outputs.findings != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:   # as pr-review-post: contents: read for the compare API
      contents: read
      pull-requests: write

    steps:
      - name: Post findings as inline comments
        env:
          FINDINGS: ${{ needs.commit-review.outputs.findings }}
          LABEL: /code-review of the pushed commits `${{ needs.commit-review.outputs.target }}`
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_ID: ${{ github.event.after }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: python
        run: *post-findings
