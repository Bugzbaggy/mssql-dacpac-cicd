name: Trigger Jenkins on PR Approval

on:
  pull_request_review:
    types: [submitted]

jobs:
  trigger-jenkins:
    # Same-repository PRs only: a fork's PR never reaches the self-hosted runner.
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Any self-hosted runner that can reach your Jenkins server.
    runs-on: self-hosted
    # Event fields reach the scripts as environment variables, never as ${{ }} inside run:,
    # so a branch name such as $(...) stays data instead of becoming a command.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
      APPROVED_BY: ${{ github.event.review.user.login }}

    steps:
      - name: 🔍 Show PR context
        run: |
          echo "PR Number: $PR_NUMBER"
          echo "PR Branch: $PR_BRANCH"
          echo "Target Branch: $TARGET_BRANCH"
          echo "PR Head Commit: $GIT_COMMIT_HASH"
          echo "Approved by: $APPROVED_BY"

      - name: Get Jenkins CSRF Crumb
        id: crumb
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          CRUMB=$(curl -s -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            "$JENKINS_URL/crumbIssuer/api/json" \
            | jq -r '.crumb')
          echo "crumb=$CRUMB" >> "$GITHUB_OUTPUT"

      - name: 🚀 Trigger Jenkins Job
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_CRUMB: ${{ steps.crumb.outputs.crumb }}
        run: |
          curl -X POST \
            -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            -H "Jenkins-Crumb:$JENKINS_CRUMB" \
            "$JENKINS_URL/job/$JENKINS_JOB/buildWithParameters" \
            --data-urlencode "PR_NUMBER=$PR_NUMBER" \
            --data-urlencode "PR_BRANCH=$PR_BRANCH" \
            --data-urlencode "GIT_COMMIT_HASH=$GIT_COMMIT_HASH" \
            --data-urlencode "APPROVED_BY=$APPROVED_BY"
